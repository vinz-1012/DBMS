# ========================== APPLICATION ==========================
spring.application.name=uteexpress
server.port=8080

# ========================== DATASOURCE (SQL Server) ==========================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=UTEEXPRESS;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ========================== JPA / HIBERNATE ==========================
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ========================== JSON SERIALIZATION ==========================
# Tránh lỗi LazyInitialization khi serialize entity có @ManyToOne LAZY
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# =============================================
# JWT
# =============================================
app.jwt.secret=UTEExpressSecretKey2024_This_Must_Be_At_Least_256_Bits_Long_For_HS256
app.jwt.expiration-ms=86400000

# =============================================
# EMAIL (Gmail SMTP) - Dien App Password vao day
# =============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=lephongle475@gmail.com
spring.mail.password=bztdhbfomsvkgobf
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# OTP expiry (minutes)
app.otp.expiry-minutes=5

# =============================================
# SPRINGDOC / SWAGGER UI
# =============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# =============================================
# LOGGING
# =============================================
logging.level.com.example.backend=DEBUG
logging.level.org.springframework.security=INFO
